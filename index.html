<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG 로그 아카이브</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/cinematic.css">
</head>
<body>
  <nav class="cine-nav" id="cineNav">
    <a class="brand" href="index.html"><span class="dice">🎲</span>로그 아카이브</a>
    <div class="cine-nav-right">
      <a class="nav-link" href="#shelf">서가</a>
      <a class="nav-link" href="characters.html">인물</a>
      <a class="nav-link" href="locations.html">장소</a>
      <button id="themeToggle" class="theme-toggle" aria-label="테마 전환" title="다크/라이트 전환">
        <span class="theme-icon">🌙</span>
      </button>
    </div>
  </nav>

  <!-- 히어로 -->
  <header class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <span class="hero-monogram" id="heroMonogram"></span>
    <span class="grain"></span>
    <span class="hero-frame tl"></span>
    <span class="hero-frame br"></span>
    <div class="hero-inner">
      <span class="hero-eyebrow" id="heroEyebrow">대표 캠페인 · Featured</span>
      <h1 id="heroTitle">캠페인 서가</h1>
      <p class="hero-desc" id="heroDesc">불러오는 중…</p>
      <div class="hero-meta" id="heroMeta"></div>
      <div class="hero-cta" id="heroCta"></div>
    </div>
    <button class="hero-arrow prev" id="heroPrev" aria-label="이전 캠페인">←</button>
    <button class="hero-arrow next" id="heroNext" aria-label="다음 캠페인">→</button>
    <div class="scroll-hint"><span class="line"></span>스크롤</div>
  </header>

  <!-- 캠페인 포스터 -->
  <section class="section" id="shelf">
    <div class="section-head">
      <div>
        <span class="eyebrow">The Shelf</span>
        <h2>캠페인 서가</h2>
      </div>
      <span class="hint">← 옆으로 넘기기 →</span>
    </div>
    <div class="poster-track" id="posterTrack"><p class="loading">캠페인을 불러오는 중…</p></div>
  </section>

  <!-- 최근 기록 -->
  <section class="section">
    <div class="section-head">
      <div>
        <span class="eyebrow">Latest</span>
        <h2>최근 기록</h2>
      </div>
      <span class="hint">최신순</span>
    </div>
    <div class="latest-track" id="latestTrack"></div>
  </section>

  <!-- 인물 / 장소 -->
  <section class="section">
    <div class="section-head">
      <div>
        <span class="eyebrow">Codex</span>
        <h2>도감</h2>
      </div>
    </div>
    <div class="quick-grid" id="quickGrid"></div>
  </section>

  <footer class="cine-footer">
    <p>© TRPG 로그 아카이브 · GitHub Pages로 호스팅됨</p>
  </footer>

  <!-- 책 펼치기 전환 오버레이 -->
  <div id="openBookOverlay" class="open-book-overlay" aria-hidden="true">
    <div class="open-book" role="presentation">
      <div class="open-book-spread-right"></div>
      <div class="open-book-spread-left"></div>
      <div class="open-book-spine-shadow"></div>
      <div class="open-book-cover"></div>
    </div>
  </div>

  <button id="scrollTop" class="scroll-top" aria-label="맨 위로" title="맨 위로">↑</button>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/cinematic.js"></script>
  <script>
    // 책 펼치기 전환 — 시네마틱 홈의 .poster 와 히어로 CTA 에 적용
    (function () {
      const overlay = document.getElementById("openBookOverlay");
      const openBook = overlay ? overlay.querySelector(".open-book") : null;
      if (!overlay || !openBook) return;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // 캠페인으로 이동하는 모든 링크: .poster 와 히어로 CTA (.btn-primary[href^="campaign.html"])
      const links = document.querySelectorAll(
        '.poster[href^="campaign.html"], .btn-primary[href^="campaign.html"]'
      );

      function triggerAndGo(href, color) {
        if (reduceMotion) { window.location.href = href; return; }
        openBook.style.setProperty("--open-color", color || "#444");
        overlay.classList.add("is-active");
        requestAnimationFrame(() => requestAnimationFrame(() => {
          openBook.classList.add("is-open");
        }));
        window.setTimeout(() => { window.location.href = href; }, 1200);
      }

      // cinematic.js 가 동적으로 .poster / .btn-primary 를 렌더하므로
      // capture phase click 을 document 에서 위임
      document.addEventListener("click", (e) => {
        const a = e.target.closest(
          '.poster[href^="campaign.html"], .btn-primary[href^="campaign.html"]'
        );
        if (!a) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        // 색상: .poster 의 --pc / 히어로 CTA 는 hero 의 --hc
        let color = getComputedStyle(a).getPropertyValue("--pc").trim();
        if (!color) {
          const hero = document.getElementById("hero");
          if (hero) color = getComputedStyle(hero).getPropertyValue("--hc").trim();
        }
        triggerAndGo(a.getAttribute("href"), color);
      }, true);
    })();
  </script>
</body>
</html>
